<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plano Diário</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div id="container">
      <div id="title-content">
        <h1 id="title">ToDo App</h1>
      </div>
      <div id="data-content">
        <form action="" id="form">
          <input
            type="text"
            id="input"
            placeholder="Digite aqui o que planeja fazer"
          />
          <button id="add-btn" type="submit">Add</button>
        </form>
        <div id="list-contaner">
          <ul class="list template hide">
            <li class="item"></li>
            <button class="btn done-btn"></button>
            <button class="btn undone-btn"></button>
            <button class="btn rem-btn"></button>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
